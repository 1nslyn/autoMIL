# autoMIL Configuration, Placeholder Dataset
# Copy this template and fill in the values for your third dataset.

project:
  name: "placeholder"
  description: "Third dataset, TBD"

task:
  name: "example_task"
  type: "binary"
  num_classes: 2
  label_column: "label"
  positive_label: 1

data:
  features_dir: "${AUTOBENCH_PLACEHOLDER_ROOT}/benchmark/features"
  splits_dir: "${AUTOBENCH_PLACEHOLDER_ROOT}/benchmark/splits/standard/example_task"
  mapping_csv: "${AUTOBENCH_PLACEHOLDER_ROOT}/metadata.csv"
  num_folds: 5
  seed: 42

encoders:
  primary: "hoptimus1"
  available:
    hoptimus1: 1536

baseline:
  model: "clam_mb"
  framework: "CLAM"
  val_auc: 0.0
  composite: 0.0

metrics:
  primary: "composite"
  composite_formula: "(val_auc + val_bacc) / 2"
  track: ["val_auc", "val_bacc"]

training:
  learning_rate: 3e-4
  weight_decay: 1e-4
  dropout: 0.25
  num_epochs: 100
  warmup_epochs: 5
  patience: 10
  batch_size: 32
  max_seq_length: 4096

# --- Frozen data substrate (example wiring; see paper/preprint/PLAN.md §5) ---
# registry.protected is a HARD submit-time gate: any submitted file matching one of
# these project-root-relative fnmatch globs is refused (src/automil/cli/submit.py:263),
# with no --force escape. Unlike files.readonly below (warning-only, bypassed by an
# explicit --files), this actually freezes the split / prep / eval / feature-extraction
# code so the agent's recipe search cannot alter the evaluation protocol or the encoder
# inputs — the precondition for a fair encoder-vs-aggregator comparison. Adjust the
# paths to your repo layout when copying this template.
registry:
  protected:
    # evaluation protocol: splits + metrics
    - "benchmarks/src/autobench/pipeline/splits.py"
    - "benchmarks/src/autobench/pipeline/prepare.py"
    - "benchmarks/src/autobench/pipeline/evaluate.py"
    - "benchmarks/src/autobench/pipeline/*/dataset.py"   # clam/abmil/dtfd/nnmil loaders
    # composite writers (the val-selection guarantee)
    - "benchmarks/src/autobench/pipeline/*/runner.py"    # shared writer = clam/runner.py
    - "benchmarks/scripts/run_experiment.py"             # entry point + summary_to_result_json
    # feature extraction / encoder inputs
    - "benchmarks/scripts/run_feature_extraction.py"
    - "benchmarks/src/autobench/data.py"                 # WSI-list CSV feeding TRIDENT

files:
  editable: ["train.py", "models/"]
  readonly: []

run:
  script: "train.py"
  command: null

orchestrator:
  poll_interval_sec: 5
  safety_margin_gb: 2.0
  default_timeout_min: 150
  max_concurrent_per_gpu: 1
  default_vram_estimate_gb: 0.5

env:
  dotenv_files:
    - benchmarks/.env
