# autoMIL Configuration, CCRCC (Clear Cell Renal Cell Carcinoma)
# Benchmark results exist for: pbrm1, high_grade × {hoptimus1, uni_v2, virchow2}
# Best baseline: clam_mb + uni_v2 on high_grade → AUC 0.790

project:
  name: "ccrcc"
  description: "CCRCC mutation and grade prediction from WSI features"

task:
  name: "high_grade"
  type: "binary"
  num_classes: 2
  label_column: "label"
  positive_label: 1

data:
  features_dir: "/home/jma/Documents/yinshuol/autoMIL/datasets/CCRCC/benchmark/features"
  splits_dir: "/home/jma/Documents/yinshuol/autoMIL/datasets/CCRCC/benchmark/splits/standard"
  mapping_csv: "/home/jma/Documents/yinshuol/autoMIL/datasets/CCRCC/CCRCC_metadata.csv"
  num_folds: 5
  seed: 42

encoders:
  primary: "uni_v2"
  available:
    uni_v2: 1536
    hoptimus1: 1536
    virchow2: 2560
    conch_v15: 768
    hibou_l: 1024
    midnight12k: 1536
    h0_mini: 768

baseline:
  model: "clam_mb"
  framework: "clam"
  test_auc: 0.790
  test_bacc: 0.698
  composite: 0.744

metrics:
  primary: "composite"
  composite_formula: "(val_auc + val_bacc) / 2"
  track: ["val_auc", "val_bacc"]

training:
  learning_rate: 1e-4
  weight_decay: 1e-5
  dropout: 0.25
  num_epochs: 200
  patience: 20
  stop_epoch: 50
  batch_size: 1
  max_seq_length: null

# H-4 (audit 2026-07-28): the frozen data substrate, ENFORCED.
# `submit.py` hard-rejects any overlay matching these globs, with no --force
# escape. Unlike the former files.readonly warning (which explicit --files could
# bypass), this actually freezes the evaluation protocol,
# the selection signal and the encoder inputs — the precondition for the paper's
# equal-effort claim. `mode: architecture-preserving` now REQUIRES a non-empty
# list, so this can no longer be silently left empty.
#
# Note what makes this affordable: H-3b gave every arm an explicit hyperparameter
# channel (--hparams / a variant's HPARAMS, checked against the declared
# per-arm search space), so freezing `pipeline/config.py` and `run_experiment.py`
# no longer costs the agent legitimate scalar tuning reach. Only declared
# hyperparameters and executable train-only PolicyVariant modules remain open;
# published model, trainer, and measurement implementations are frozen.
registry:
  mode: "architecture-preserving"
  allowed_override_options: ["--hparams", "--policy-variant"]
  allowed_variant_kinds: ["policy"]
  # These scalar switches erase CLAM's defining instance-loss mechanism.
  identity_locked_hparams: ["no_inst_cluster", "bag_weight"]
  protected:
    # --- evaluation protocol: splits, prep, metrics ---
    - "benchmarks/src/autobench/pipeline/splits.py"
    - "benchmarks/src/autobench/pipeline/prepare.py"
    - "benchmarks/src/autobench/pipeline/evaluate.py"
    - "benchmarks/src/autobench/pipeline/*/prepare.py"    # per-framework prep incl. feature conversion
    - "benchmarks/src/autobench/pipeline/*/evaluate.py"
    - "benchmarks/src/autobench/pipeline/dtfd/eval.py"    # named separately: not */evaluate.py
    - "benchmarks/src/autobench/pipeline/*/dataset.py"    # split + feature consumers
    # --- the selection signal (the val-firewall guarantee) ---
    - "benchmarks/src/autobench/pipeline/*/runner.py"     # shared writer = clam/runner.py
    - "benchmarks/scripts/run_experiment.py"              # entry point + summary_to_result_json
    - "benchmarks/src/autobench/pipeline/results_cache.py"  # CR-5b cache identity
    - "benchmarks/src/autobench/pipeline/results.py"
    # --- the declared search space itself (A-2) ---
    - "benchmarks/src/autobench/pipeline/search_space.py"
    - "benchmarks/src/autobench/pipeline/hparams.py"
    # --- experiment identity: fold count, seed, labels, feature roots ---
    - "benchmarks/src/autobench/pipeline/config.py"       # TrainConfig.seed, n_folds
    - "benchmarks/src/autobench/config.py"                # dataset-YAML loader
    - "benchmarks/datasets/"                              # labels, label_map, feature roots
    # --- feature extraction / encoder inputs ---
    - "benchmarks/scripts/run_feature_extraction.py"
    - "benchmarks/src/autobench/data.py"                  # WSI-list CSV feeding TRIDENT

files:
  # H-4: `run_experiment.py` and `pipeline/config.py` were listed here, and the
  # no---files branch auto-detects editable files with NO readonly check at all —
  # so the split entry point, the composite writer and the fold/seed dataclasses
  # were captured silently. They are now protected instead. Nothing legitimate is
  # lost: hyperparameters travel through --hparams / a variant's HPARAMS (H-3b),
  # and executable policy variants live behind the protected PolicyVariant seam.
  editable:
    - "benchmarks/experiments/ccrcc/automil/variants/_policies/*.py"
run:
  script: null
  command: "python benchmarks/scripts/run_experiment.py --dataset ccrcc --task high_grade --encoder uni_v2 --model clam_mb --framework clam --no_wandb"

orchestrator:
  poll_interval_sec: 5
  safety_margin_gb: 2.0
  default_timeout_min: 150
  # Saturate GPUs: CLAM bag training peaks at ~0.4 GB per worker and the
  # GPUs here have ~48 GB. Bin-pack aggressively, the queue must drain in
  # parallel, not serially. If a worker OOMs, lower this cap; never leave
  # it at 1 "just in case."
  max_concurrent_per_gpu: 4
  default_vram_estimate_gb: 1.0

# CLN-02 / D-04 / D-05: Subprocess env whitelist, ccrcc declares the
# consumer-specific env vars its training scripts need. The orchestrator's
# system whitelist (PATH/HOME/LC_*/CUDA_*/NVIDIA_*/AUTOMIL_*/...) is applied
# automatically; this list is the literal-name passthrough for project-level
# vars (no globs at the config layer). Phase 8/DEC-01 will remove the
# orchestrator-side AUTOBENCH_ROOT injection, at which point this passthrough
# list is the sole mechanism keeping ccrcc's experiments wired. Names here
# must match the ${...} references in benchmarks/datasets/*.yaml.
env:
  passthrough:
    - AUTOBENCH_ROOT
    - AUTOBENCH_CCRCC_ROOT
    - AUTOBENCH_CLWD_ROOT
    - AUTOBENCH_HANCOCK_ROOT
    - AUTOBENCH_OVARIAN_ROOT
    - AUTOBENCH_PLACEHOLDER_ROOT
    - AUTOBENCH_TCGA_LUAD_ROOT
  dotenv_files:
    - benchmarks/.env

viz:
  port: 8421
  host: "0.0.0.0"
