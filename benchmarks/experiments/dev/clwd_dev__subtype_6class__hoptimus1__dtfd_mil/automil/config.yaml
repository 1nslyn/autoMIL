project:
  name: clwd_dev__subtype_6class__hoptimus1__dtfd_mil
  description: 'development cell (not a campaign cell): clwd_dev__subtype_6class__hoptimus1__dtfd_mil'
task:
  name: subtype_6class
  type: classification
  num_classes: 6
  label_column: Benchmark_Label_2021_6class
data:
  features_dir: ${AUTOBENCH_CLWD_ROOT}/trident_output/20x_256px_0px_overlap/features_hoptimus1
  splits_dir: ${AUTOBENCH_CLWD_ROOT}/benchmark_dev/splits/devcv/subtype_6class
  mapping_csv: ${AUTOBENCH_CLWD_ROOT}/CLWD_dev.csv
  num_folds: 5
  seed: 42
encoders:
  primary: hoptimus1
  available:
    hoptimus1: 1536
metrics:
  primary: val_auc_smooth
  track:
  - val_auc_smooth
  - val_auc
  - val_bacc
scoring:
  formula: val_auc_smooth
  technique_map: {}
  accept_margin: 0.015
  se_multiplier: 1.0
  guard:
    metric: val_bacc
    strategy: devcv
    margin: 0.0084
    basis: 'one validation slide: 1/(5 folds x 6 classes x 4 slides in the smallest
      validation class ''Lepidic'') = 0.008333, rounded up to the 4-decimal grid the
      metric is recorded on'
    validation_class_counts:
      '0':
        Acinar: 13
        In situ: 12
        Lepidic: 5
        Micropapillary: 10
        Papillary: 13
        Solid: 11
      '1':
        Acinar: 12
        In situ: 12
        Lepidic: 5
        Micropapillary: 10
        Papillary: 13
        Solid: 12
      '2':
        Acinar: 12
        In situ: 13
        Lepidic: 4
        Micropapillary: 10
        Papillary: 14
        Solid: 11
      '3':
        Acinar: 12
        In situ: 12
        Lepidic: 4
        Micropapillary: 10
        Papillary: 14
        Solid: 11
      '4':
        Acinar: 12
        In situ: 13
        Lepidic: 4
        Micropapillary: 10
        Papillary: 13
        Solid: 11
registry:
  mode: architecture-preserving
  policy_smoke:
    command:
    - '{python}'
    - -m
    - autobench.pipeline.policy_smoke
    - --task-family
    - classification
    - --arm
    - dtfd
    timeout_s: 180
  allowed_override_options:
  - --hparams
  - --policy-variant
  allowed_variant_kinds:
  - policy
  policy_method_imports:
  - torch
  - numpy
  - math
  - autobench.pipeline.ema
  - collections
  - itertools
  - functools
  - copy
  - typing
  identity_locked_hparams:
  - no_inst_cluster
  - bag_weight
  - model_size
  - M
  - L
  - mDim
  - numLayer_Res
  - hidden_dim
  protected:
  - benchmarks/src/autobench/pipeline/splits.py
  - benchmarks/src/autobench/pipeline/prepare.py
  - benchmarks/src/autobench/pipeline/evaluate.py
  - benchmarks/src/autobench/pipeline/*/prepare.py
  - benchmarks/src/autobench/pipeline/*/evaluate.py
  - benchmarks/src/autobench/pipeline/dtfd/eval.py
  - benchmarks/src/autobench/pipeline/*/dataset.py
  - benchmarks/src/autobench/pipeline/*/runner.py
  - benchmarks/scripts/run_experiment.py
  - benchmarks/src/autobench/pipeline/results_cache.py
  - benchmarks/src/autobench/pipeline/results.py
  - benchmarks/src/autobench/pipeline/val_loss.py
  - benchmarks/src/autobench/pipeline/abmil/train.py
  - benchmarks/src/autobench/pipeline/dtfd/train.py
  - benchmarks/src/autobench/pipeline/titan/train.py
  - benchmarks/src/autobench/pipeline/selection.py
  - benchmarks/src/autobench/pipeline/policy_dispatch.py
  - benchmarks/src/autobench/pipeline/policy_step.py
  - benchmarks/src/autobench/pipeline/policy_smoke.py
  - benchmarks/src/autobench/pipeline/*/survival_train.py
  - benchmarks/lib/nnMIL/training/trainers/classification_trainer.py
  - benchmarks/lib/nnMIL/training/trainers/survival_trainer.py
  - benchmarks/lib/nnMIL/training/trainers/survival_porpoise_trainer.py
  - benchmarks/lib/nnMIL/training/callbacks/early_stopping.py
  - benchmarks/lib/CLAM/utils/core_utils.py
  - benchmarks/src/autobench/pipeline/search_space.py
  - benchmarks/src/autobench/pipeline/hparams.py
  - benchmarks/src/autobench/pipeline/config.py
  - benchmarks/src/autobench/config.py
  - benchmarks/datasets/
  - benchmarks/scripts/run_feature_extraction.py
  - benchmarks/src/autobench/data.py
files:
  editable:
  - benchmarks/experiments/dev/clwd_dev__subtype_6class__hoptimus1__dtfd_mil/automil/variants/_policies/*.py
run:
  script: null
  command: python benchmarks/scripts/run_experiment.py --dataset benchmarks/datasets/other/clwd_dev.yaml
    --task subtype_6class --encoder hoptimus1 --model dtfd_mil --framework dtfd --strategy
    devcv --seed 42 --n_folds 5 --folds 0,1,2,3,4 --no_wandb
  mil_model: dtfd_mil
cap:
  mode: wall_clock
  budget: 90d
  safety_buffer: 1h
  eval_budget: 200
orchestrator:
  poll_interval_sec: 5
  safety_margin_gb: 2.0
  default_timeout_min: 1020
  max_concurrent_per_gpu: 4
  default_vram_estimate_gb: 6.0
env:
  passthrough:
  - AUTOBENCH_ROOT
  - AUTOBENCH_CLWD_ROOT
  - AUTOBENCH_BAG_CACHE
  - NNMIL_NUM_WORKERS
  dotenv_files:
  - benchmarks/.env
viz:
  port: 8824
  host: 127.0.0.1
training:
  fold_count: 5
