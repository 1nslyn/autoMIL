name: cptac_ccrcc
description: "CPTAC-CCRCC — Clear Cell Renal Cell Carcinoma"

paths:
  data_root: "${AUTOBENCH_CPTAC_CCRCC_ROOT}"
  wsi_dir: "${data_root}/wsi"
  mapping_csv: "${data_root}/normalized_manifest.csv"
  output_dir: "${data_root}/trident_output"
  benchmark_dir: "${data_root}/benchmark"
  features_base_dir: "${output_dir}/20x_224px_0px_overlap"

tasks:
  bap1:
    label_col: "BAP1_binary"
    label_map:
      0: "wildtype"
      1: "mutant"
    n_classes: 2
  vhl:
    label_col: "VHL_binary"
    label_map:
      0: "negative"
      1: "positive"
    n_classes: 2
  pbrm1:
    label_col: "PBRM1_binary"
    label_map:
      0: "wildtype"
      1: "mutant"
    n_classes: 2
  immune_class:
    label_col: "IMMUNE_CLASS_binary"
    label_map:
      0: "low"
      1: "medium"
      2: "high"
    n_classes: 3
  os:
    task_type: survival
    event_col: OS_event
    time_col: OS_time
    survival_losses: [cox, nllsurv]
    nll_bins: 4

split_strategies:
  standard:
    train_cohorts: []
    test_cohorts: []

task_strategy_feasibility:
  bap1: ["standard"]
  vhl: ["standard"]
  pbrm1: ["standard"]
  immune_class: ["standard"]
  os: ["standard"]

slide_id_column: "slide_id"
slide_id_transform: null
wsi_extension: ".svs"
case_id_column: "case_id"
status_column: null
status_value: null

encoders:
  models:
    "paige-ai/Virchow2": "virchow2"
    "bioptimus/H-optimus-1": "hoptimus1"
    "MahmoodLab/UNI2-h": "uni_v2"
  dims:
    virchow2: 2560
    hoptimus1: 1536
    uni_v2: 1536

nnmil_models:
  - ab_mil
  - trans_mil

extraction:
  magnification: 20
  patch_size: 224
  batch_size: 64
