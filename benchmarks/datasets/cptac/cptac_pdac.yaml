name: cptac_pdac
description: "CPTAC-PDAC — Pancreatic Ductal Adenocarcinoma (immune subtype, 3-class low/medium/high)"

paths:
  data_root: "${AUTOBENCH_CPTAC_PDAC_ROOT}"
  wsi_dir: "${data_root}/wsi"
  mapping_csv: "${data_root}/normalized_manifest.csv"
  output_dir: "${data_root}/trident_output"
  benchmark_dir: "${data_root}/benchmark"
  features_base_dir: "${output_dir}/20x_224px_0px_overlap"

# immune_class is a 3-class subtype task (low / medium / high tumour-immune
# infiltration). Prepared via scripts/manifests/prepare_cptac_manifest.py, which
# names the label column {TASK}_binary regardless of class count — so
# IMMUNE_CLASS_binary carries three integer classes (0/1/2), matching the
# existing cptac_ccrcc.yaml convention. OS survival is joined from the GDC
# clinical export (add_os_to_manifest.py works for CPTAC as well as TCGA).
tasks:
  immune_class:
    label_col: "IMMUNE_CLASS_binary"
    label_map:
      0: "low"
      1: "medium"
      2: "high"
    n_classes: 3
  os:
    task_type: survival
    event_col: OS_event
    time_col: OS_time
    survival_losses: [cox, nllsurv]
    nll_bins: 4

split_strategies:
  standard:
    train_cohorts: []
    test_cohorts: []

task_strategy_feasibility:
  immune_class: ["standard"]
  os: ["standard"]

slide_id_column: "slide_id"
slide_id_transform: null
wsi_extension: ".svs"
case_id_column: "case_id"
status_column: null
status_value: null

encoders:
  models:
    "paige-ai/Virchow2": "virchow2"
    "bioptimus/H-optimus-1": "hoptimus1"
    "MahmoodLab/UNI2-h": "uni_v2"
  dims:
    virchow2: 2560
    hoptimus1: 1536
    uni_v2: 1536

clam_models:
  - clam_mb

nnmil_models:
  - simple_mil

abmil_models:
  - abmil

dtfd_models:
  - dtfd_mil

titan:
  head: linear

extraction:
  magnification: 20
  patch_size: 224
  batch_size: 64
