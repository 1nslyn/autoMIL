name: cptac_lscc  # CPTAC-LSCC / CPTAC-LUSC (lowercase, no hyphens)
description: "CPTAC-LSCC (CPTAC-LUSC) — Lung Squamous Cell Carcinoma (ARID1A/KEAP1 mutation, histologic grade, immune class)"

paths:
  data_root: "${AUTOBENCH_CPTAC_LSCC_ROOT}"            # Set in benchmarks/.env
  wsi_dir: "${data_root}/wsi"                           # Flat directory of .svs files
  mapping_csv: "${data_root}/normalized_manifest.csv"   # Generated by prepare_cptac_manifest.py
  output_dir: "${data_root}/trident_output"
  benchmark_dir: "${data_root}/benchmark"
  features_base_dir: "${output_dir}/20x_224px_0px_overlap"

# label_col must match the {GENE}_binary column produced by prepare_cptac_manifest.py
# (gene = task name with _mutation/_status/_expression stripped, then uppercased).
tasks:
  arid1a:
    label_col: "ARID1A_binary"
    label_map:
      0: "wildtype"
      1: "mutant"
    n_classes: 2
  keap1:
    label_col: "KEAP1_binary"
    label_map:
      0: "wildtype"
      1: "mutant"
    n_classes: 2
  histologic_grade:
    label_col: "HISTOLOGIC_GRADE_binary"
    label_map:
      0: "well_differentiated"
      1: "moderately_differentiated"
    n_classes: 2
  immune_class:
    label_col: "IMMUNE_CLASS_binary"
    label_map:
      0: "low"
      1: "medium"
      2: "high"
    n_classes: 3

split_strategies:
  standard:
    train_cohorts: []
    test_cohorts: []

task_strategy_feasibility:
  arid1a: ["standard"]
  keap1: ["standard"]
  histologic_grade: ["standard"]
  immune_class: ["standard"]

# Patho-Bench slide_id is a filename stem with no extension — matches TRIDENT .h5 naming.
slide_id_column: "slide_id"
slide_id_transform: null
wsi_extension: ".svs"
case_id_column: "case_id"
status_column: null
status_value: null

# Three target encoders for this round of extraction.
encoders:
  models:
    "paige-ai/Virchow2": "virchow2"
    "bioptimus/H-optimus-1": "hoptimus1"
    "MahmoodLab/UNI2-h": "uni_v2"
  dims:
    virchow2: 2560
    hoptimus1: 1536
    uni_v2: 1536

nnmil_models:
  - ab_mil
  - trans_mil

extraction:
  magnification: 20
  patch_size: 224
  batch_size: 64
