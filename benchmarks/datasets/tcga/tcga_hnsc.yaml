name: tcga_hnsc
description: "TCGA-HNSC — Head & Neck Squamous Cell Carcinoma (tumor grade, 3-class G1/G2/G3)"

paths:
  data_root: "${AUTOBENCH_TCGA_HNSC_ROOT}"
  wsi_dir: "${data_root}/wsi"
  mapping_csv: "${data_root}/normalized_manifest.csv"
  output_dir: "${data_root}/trident_output"
  benchmark_dir: "${data_root}/benchmark"
  features_base_dir: "${output_dir}/20x_224px_0px_overlap"

# Tumor grade is a 3-class ORDINAL task (G1 < G2 < G3), not a GOLDMARK mutation.
# The GRADE column (0/1/2) is joined onto the manifest from the GDC clinical
# export (diagnoses.tumor_grade → G1/G2/G3), the same clinical.tsv that
# scripts/manifests/add_os_to_manifest.py uses for the OS labels below. Cases
# with grade GX / not-reported get no label and are dropped from the grade task.
tasks:
  grade:
    label_col: "GRADE"
    label_map:
      0: "g1"
      1: "g2"
      2: "g3"
    n_classes: 3
  os:
    task_type: survival
    event_col: OS_event
    time_col: OS_time
    survival_losses: [cox, nllsurv]
    nll_bins: 4

split_strategies:
  standard:
    train_cohorts: []
    test_cohorts: []

task_strategy_feasibility:
  grade: ["standard"]
  os: ["standard"]

slide_id_column: "slide_name"
slide_id_transform: "strip_svs"
wsi_extension: null
case_id_column: "sample_names"
status_column: null
status_value: null

encoders:
  models:
    "paige-ai/Virchow2": "virchow2"
    "bioptimus/H-optimus-1": "hoptimus1"
    "MahmoodLab/UNI2-h": "uni_v2"
  dims:
    virchow2: 2560
    hoptimus1: 1536
    uni_v2: 1536

clam_models:
  - clam_mb

nnmil_models:
  - simple_mil

abmil_models:
  - abmil

dtfd_models:
  - dtfd_mil

titan:
  head: linear

extraction:
  magnification: 20
  patch_size: 224
  batch_size: 64
