name: tcga_hnsc
description: "TCGA-HNSC — Head and Neck Squamous Cell Carcinoma (PIK3CA mutation prediction)"

paths:
  data_root: "${AUTOBENCH_TCGA_HNSC_ROOT}"
  wsi_dir: "${data_root}/wsi"
  mapping_csv: "${data_root}/normalized_manifest.csv"
  output_dir: "${data_root}/trident_output"
  benchmark_dir: "${data_root}/benchmark"
  features_base_dir: "${output_dir}/20x_224px_0px_overlap"

tasks:
  # PIK3CA chosen over HRAS: HRAS has only 25 positives in 431 slides (~5/fold),
  # too rare for a stable 5-fold benchmark. PIK3CA = 66 positives (~13/fold).
  pik3ca:
    label_col: "PIK3CA_binary"
    label_map:
      0: "wildtype"
      1: "mutant"
    n_classes: 2

split_strategies:
  standard:
    train_cohorts: []
    test_cohorts: []

task_strategy_feasibility:
  pik3ca: ["standard"]

slide_id_column: "slide_name"
slide_id_transform: "strip_svs"
wsi_extension: null
case_id_column: "sample_names"
status_column: null
status_value: null

encoders:
  models:
    "paige-ai/Virchow2": "virchow2"
    "bioptimus/H-optimus-1": "hoptimus1"
    "MahmoodLab/UNI2-h": "uni_v2"
  dims:
    virchow2: 2560
    hoptimus1: 1536
    uni_v2: 1536

nnmil_models:
  - trans_mil
  - simple_mil

abmil_models:
  - abmil

titan:
  head: linear

extraction:
  magnification: 20
  patch_size: 224
  batch_size: 64
