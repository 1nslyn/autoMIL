name: tcga_blca
description: "TCGA-BLCA — Bladder Urothelial Carcinoma (PIK3CA mutation prediction)"

paths:
  data_root: "${AUTOBENCH_TCGA_BLCA_ROOT}"
  wsi_dir: "${data_root}/wsi"
  mapping_csv: "${data_root}/normalized_manifest.csv"
  output_dir: "${data_root}/trident_output"
  benchmark_dir: "${data_root}/benchmark"
  features_base_dir: "${output_dir}/20x_224px_0px_overlap"

tasks:
  # PIK3CA (77 positives, ~15/fold) — BLCA's best classification label. Below the
  # >100 bar, but accepted: BLCA is a survival anchor (175 deaths) and this keeps
  # every dataset's gene distinct. Other BLCA genes are rarer (FGFR3 34, etc.).
  pik3ca:
    label_col: "PIK3CA_binary"
    label_map:
      0: "wildtype"
      1: "mutant"
    n_classes: 2
  os:
    task_type: survival
    event_col: OS_event
    time_col: OS_time
    survival_losses: [cox, nllsurv]
    nll_bins: 4

split_strategies:
  standard:
    train_cohorts: []
    test_cohorts: []

task_strategy_feasibility:
  pik3ca: ["standard"]
  os: ["standard"]

slide_id_column: "slide_name"
slide_id_transform: "strip_svs"
wsi_extension: null
case_id_column: "sample_names"
status_column: null
status_value: null

encoders:
  models:
    "paige-ai/Virchow2": "virchow2"
    "bioptimus/H-optimus-1": "hoptimus1"
    "MahmoodLab/UNI2-h": "uni_v2"
  dims:
    virchow2: 2560
    hoptimus1: 1536
    uni_v2: 1536

clam_models:
  - clam_mb

nnmil_models:
  - simple_mil

abmil_models:
  - abmil

dtfd_models:
  - dtfd_mil

titan:
  head: linear

extraction:
  magnification: 20
  patch_size: 224
  batch_size: 64
