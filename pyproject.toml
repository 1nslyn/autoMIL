[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "automil"
dynamic = ["version"]
description = "Autonomous agent-driven MIL model improvement for computational pathology"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Leo Yin", email = "leo.yin1127@gmail.com" }]
keywords = [
    "multiple-instance-learning",
    "computational-pathology",
    "histopathology",
    "whole-slide-imaging",
    "automl",
    "autonomous-agents",
    "experiment-tracking",
    "machine-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "aiohttp>=3.9",
    "watchdog>=4.0",
    "jinja2>=3.1",
    "click>=8.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # torch is intentionally NOT a core dependency: the framework stays importable
    # without torch (D-24 / Plan 01-01 invariant). Torch lives in the [ml] extra.
    "scipy>=1.11",      # D-141 GTE-04: paired Wilcoxon + bootstrap CI (gate stats)
    "jsonschema>=4.18",  # D-201 DEC-03: result.json schema validation
]

[project.urls]
Homepage = "https://automil.org"
Repository = "https://github.com/leoyin1127/autoMIL"
Issues = "https://github.com/leoyin1127/autoMIL/issues"

[project.optional-dependencies]
ml = [
    "torch>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "h5py>=3.9",
]
slurm = ["submitit>=1.5.3"]   # BCK-05 — opt-in SLURM backend
ray   = ["ray>=2.55.1"]       # BCK-06 — opt-in Ray backend
examples-iris = ["scikit-learn>=1.4", "pyyaml>=6.0"]  # D-203 sklearn-iris consumer demo

[project.scripts]
automil = "automil.cli:main"

# Version is derived from git tags (vX.Y.Z) via hatch-vcs — single source of
# truth, so package metadata can't drift from the tag again.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/automil"]

# Constrain the sdist to just the package + metadata. Without this, hatchling's
# default VCS sweep bundles the whole monorepo (benchmarks/lib third-party code,
# .planning/, paper/ drafts) into the tarball — bloat + a licensing hazard.
[tool.hatch.build.targets.sdist]
only-include = ["src/automil", "README.md", "LICENSE", "CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_slurm: requires SLURM cluster (skip in CI; nightly only)",
    "requires_ray: requires real Ray cluster (skip in CI; nightly only)",
    "requires_ccrcc_data: requires real CCRCC dataset at AUTOBENCH_CCRCC_ROOT (workstation only)",
    "workstation: requires workstation with data + GPU; skipped in CI",
]

[dependency-groups]
dev = [
    "numpy>=2.2.6",
    "pytest>=9.0.2",
    "scipy>=1.15.3",
]

[tool.uv.workspace]
members = ["benchmarks"]
