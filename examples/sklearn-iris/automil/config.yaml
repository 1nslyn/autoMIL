# automil/config.yaml for sklearn-iris consumer (DEC-02 / D-203).
# This file is the rendered output of `automil init` for a sklearn-only project.
# The framework's config.yaml.j2 template renders this exact shape.

run:
  script: train.py
  mil_model: sklearn_iris        # budget-cell key (D-12); lets `automil submit` run without --mil-model

data:
  seed: 42

# CR-1b: scoring.formula is ENFORCED — the framework recomputes the
# primary_value from the validation `metrics` block at ingest and refuses
# unsupported formulas closed. The selector names the metric train.py
# emits: primary_value == val_accuracy.
scoring:
  formula: "val_accuracy"

# DEC-05 / D-202: env.required is empty; sklearn-iris reads no env vars.
# env.passthrough is empty for the same reason.
env:
  required: []
  passthrough: []

# Baseline primary_value is updated by the agent after the first experiment.
baseline:
  primary_value: 0.0

# Cap configuration: consumer-supplied. iris is CPU-only and fast.
cap:
  budget_seconds: 60
  safety_buffer_seconds: 10

# Hardware: CPU-only consumer.
hardware:
  accelerator: cpu
  gpu_count: 0
  min_vram_gb: 0.0

# Files the agent's overlay may edit.
files:
  editable:
    - automil/variants/

# Backend: local for the demo.
backend:
  name: local
